spring.application.name=jobtracker

spring.datasource.url=jdbc:mysql://localhost:3306/jobtracker?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
server.port=8080

# Google Gemini API Configuration (Free tier - 1500 requests/day)
# Get your free key at: https://aistudio.google.com/app/apikey
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash-lite}
gemini.fallback-models=${GEMINI_FALLBACK_MODELS:gemini-2.5-flash,gemini-2.0-flash}
gemini.retry.max-attempts=${GEMINI_RETRY_MAX_ATTEMPTS:2}

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000}
