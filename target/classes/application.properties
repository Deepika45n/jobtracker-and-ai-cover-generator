spring.application.name=jobtracker

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/jobtracker?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
server.port=8080

# ── AI Provider Configuration ──────────────────────────────────────────
# Providers are activated individually. The AIRouterService iterates
# available providers in priority order with automatic fallback.
# The TemplateProvider (priority=100) is always active as the last resort.

# Gemini (priority=1, primary)
gemini.enabled=${GEMINI_ENABLED:true}
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash-lite}
gemini.fallback-models=${GEMINI_FALLBACK_MODELS:gemini-2.5-flash,gemini-2.0-flash}
gemini.retry.max-attempts=${GEMINI_RETRY_MAX_ATTEMPTS:2}

# OpenRouter (priority=2, secondary)
openrouter.enabled=${OPENROUTER_ENABLED:false}
openrouter.api.key=${OPENROUTER_API_KEY:}
openrouter.model=${OPENROUTER_MODEL:meta-llama/llama-3.1-8b-instruct:free}
openrouter.retry.max-attempts=${OPENROUTER_RETRY_MAX_ATTEMPTS:2}

# Cloudflare Workers AI (priority=3, tertiary)
cloudflare.enabled=${CLOUDFLARE_ENABLED:false}
cloudflare.account.id=${CLOUDFLARE_ACCOUNT_ID:}
cloudflare.api.token=${CLOUDFLARE_API_TOKEN:}
cloudflare.model=${CLOUDFLARE_MODEL:@cf/meta/llama-3.1-8b-instruct}
cloudflare.retry.max-attempts=${CLOUDFLARE_RETRY_MAX_ATTEMPTS:2}

# ── Caching ────────────────────────────────────────────────────────────
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=86400s

# ── Rate Limiting ──────────────────────────────────────────────────────
# Max AI-enhanced (PROFESSIONAL) generations per user per day.
# STANDARD (template-only) mode is always unlimited.
ratelimit.ai.daily-limit=${RATELIMIT_AI_DAILY_LIMIT:20}

# ── CORS Configuration ────────────────────────────────────────────────
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000,https://jobtracker-frontend.vercel.app,https://jobtracker-frontend.netlify.app}
